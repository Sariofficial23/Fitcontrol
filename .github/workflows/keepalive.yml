name: keep-alive

# Pings the backend health endpoint on a schedule so the free-tier web service
# never sleeps (and is woken quickly after a cold start). This runs on GitHub's
# infrastructure, independent of whether the server is currently awake, so it
# covers the gap the in-process self-ping cannot (reviving a spun-down instance).
#
# Override the default URL by setting a repository variable named KEEPALIVE_URL
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    # Every 10 minutes. GitHub's minimum granularity is 5 minutes; scheduled
    # runs can be delayed under load, which is fine for keep-alive.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.KEEPALIVE_URL }}"
          if [ -z "$URL" ]; then
            URL="https://fitcontrol-1-j7dj.onrender.com/health"
          fi
          echo "Pinging $URL"
          code=$(curl -fsS -m 30 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP $code"
          # A cold start may take >30s; one retry gives the instance time to wake.
          if [ "$code" != "200" ]; then
            echo "Retrying after cold-start delay..."
            sleep 40
            code=$(curl -fsS -m 60 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "HTTP $code"
          fi
          [ "$code" = "200" ]
